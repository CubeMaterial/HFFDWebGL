<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | HealthFunctionalFoodsDictionary</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-container {
      height: 100%;
      width: auto;
      max-width: 1080px; /* 원하는 해상도에 맞게 조정 (가로 기준) */
      aspect-ratio: 9 / 16;
      position: relative;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #1A1F30;
    }
  </style>
</head>

<body>
<div id="unity-container">
  <canvas id="unity-canvas"></canvas>
</div>

<script src="Build/Build.loader.js"></script>
<script>
  // 모바일 대응을 위한 viewport 설정
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    var meta = document.createElement('meta');
    meta.name = 'viewport';
    meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
    document.getElementsByTagName('head')[0].appendChild(meta);
  }

  createUnityInstance(document.querySelector("#unity-canvas"), {
    dataUrl: "Build/Build.data.br",
    frameworkUrl: "Build/Build.framework.js.br",
    codeUrl: "Build/Build.wasm.br",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "HealthFunctionalFoodsDictionary",
    productVersion: "1.0",
  });
</script>
</body>
</html>
